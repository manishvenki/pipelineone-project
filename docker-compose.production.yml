# ==========================================
# Pipeline One — Complete Production Stack
# ==========================================

services:
  # Primary Relational Database
  postgres:
    image: postgres:18-alpine
    container_name: pipelineone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-pipeline_one}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-pipeline_one}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-net

  # Backend API & CI/CD Orchestration Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pipelineone-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-pipeline_one}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      VERCEL_CLIENT_ID: ${VERCEL_CLIENT_ID}
      VERCEL_CLIENT_SECRET: ${VERCEL_CLIENT_SECRET}
      VERCEL_REDIRECT_URI: ${VERCEL_REDIRECT_URI}
      ALLOW_PRIVATE_JENKINS: ${ALLOW_PRIVATE_JENKINS:-false}
    volumes:
      - server-storage:/app/storage
      - server-backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock # For container builds
    networks:
      - pipeline-net

  # Frontend Web UI (Nginx reverse proxy + static SPA)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pipelineone-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - pipeline-net

volumes:
  postgres-data:
  server-storage:
  server-backups:

networks:
  pipeline-net:
    driver: bridge
